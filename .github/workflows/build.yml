name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      buildVariant:
        type: choice
        description: 'Build Variant'
        required: true
        default: 'NormalOptimized'
        options:
          - NormalOptimized
          - NormalDebug
          - VROptimized
          - VRDebug
          - LegacyOptimized

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Determine Build Variant
        id: variant
        shell: bash
        run: |
          VARIANT="${{ github.event.inputs.buildVariant }}"
          echo "variant=${VARIANT:-NormalOptimized}" >> $GITHUB_OUTPUT

      - name: Check Valid Version Tags
        id: valid-tags
        shell: bash
        run: |
          echo "count=$(git tag -l 'v[0-9]*' | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Fetch upstream tags
        if: steps.valid-tags.outputs.count == '0'
        shell: bash
        run: |
          git remote add upstream https://github.com/hrydgard/ppsspp.git || true
          git fetch --deepen=15000 --no-recurse-submodules --tags --force upstream || exit 0

      - name: Setup JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract PS2 Core (libemucore) from NetherSX2
        shell: bash
        run: |
          mkdir -p android/src/main/jniLibs/arm64-v8a
          if [ -f nethersx2/nethersx2.apk ]; then
            unzip -p nethersx2/nethersx2.apk lib/arm64-v8a/libemucore.so > android/src/main/jniLibs/arm64-v8a/libemucore.so
            chmod +x android/src/main/jniLibs/arm64-v8a/libemucore.so
            echo "Successfully extracted libemucore.so from nethersx2.apk"
            ls -lh android/src/main/jniLibs/arm64-v8a/
          elif [ -f nethersx2/apk/adreno/root/lib/arm64-v8a/libemucore.so ]; then
            cp nethersx2/apk/adreno/root/lib/arm64-v8a/libemucore.so android/src/main/jniLibs/arm64-v8a/
            chmod +x android/src/main/jniLibs/arm64-v8a/libemucore.so
            echo "Successfully copied libemucore.so from nethersx2 repo"
            ls -lh android/src/main/jniLibs/arm64-v8a/
          fi

      - name: Assemble APK
        run: ./gradlew assemble${{ steps.variant.outputs.variant }} --stacktrace

      - name: Package build
        run: |
          mkdir -p ppsspp
          find android/build -name "*.apk" -exec cp -v {} ppsspp/ \; || true
          if [ -z "$(ls -A ppsspp)" ]; then
            find . -name "*.apk" -not -path "./ppsspp/*" -exec cp -v {} ppsspp/ \; || true
          fi
          echo "Found APKs:"
          ls -lh ppsspp/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PPSSPP-${{ steps.variant.outputs.variant }}-APK
          path: ppsspp/
